<h1 class="text-3xl">Listado de pokemons</h1>
<h2 class="text-xl">
  Pagina actual: {{ currentPage() }}
</h2>

<hr class="my-2">

<!-- Pokemon List -->
 @if (pokemons() ) {
  <pokemon-list [pokemons]="pokemons()"/>
 } @else {
  <pokemon-list-skeleton />
 }

<!-- Botones para cargar siguientes y anteriores -->
 <div class="flex justify-between mt-2">
  <button class="mt-2" (click)="loadPokemons(-1)">
    Anteriores
  </button>
  <button class="mt-2" (click)="loadPokemons(+1)">
    Siguientes
  </button>
 </div>
